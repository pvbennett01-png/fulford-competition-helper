name: Build Desktop App

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Version from tag (app-v1.2.3 -> 1.2.3)
        shell: bash
        run: echo "VER=${GITHUB_REF_NAME#app-v}" >> "$GITHUB_ENV"

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          # Publishes to the PUBLIC releases repo so the in-app updater (and committee) can download
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: pvbennett01-png
          repo: fulford-competition-helper-releases
          updaterJsonPreferNsis: true
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: 'Fulford Competition Helper ${{ env.VER }}'
          # Release page shown to the committee - two clear download links (Windows job creates the release)
          releaseBody: |
            ## ⬇️ Download Fulford Competition Helper

            ### 🪟 Windows PC → **[Download for Windows](https://github.com/pvbennett01-png/fulford-competition-helper-releases/releases/download/${{ github.ref_name }}/Fulford.Competition.Helper_${{ env.VER }}_x64-setup.exe)**
            Then open the downloaded file. If Windows shows "Windows protected your PC", click **More info** → **Run anyway**.

            ### 🍎 Mac → **[Download for Mac](https://github.com/pvbennett01-png/fulford-competition-helper-releases/releases/download/${{ github.ref_name }}/Fulford.Competition.Helper_${{ env.VER }}_universal.dmg)**
            Open the downloaded file and drag the app into **Applications**.

            ---
            *Once installed, the app checks for new versions itself – just click **Install now** when asked. You can ignore the list of files below; they are used by the automatic updater.*
          releaseDraft: false
          prerelease: false

  build-macos:
    # Run after Windows so both jobs don't race to create the release / latest.json
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Version from tag (app-v1.2.3 -> 1.2.3)
        shell: bash
        run: echo "VER=${GITHUB_REF_NAME#app-v}" >> "$GITHUB_ENV"

      - name: Build Tauri app (macOS universal)
        uses: tauri-apps/tauri-action@v0
        env:
          # Publishes to the PUBLIC releases repo so the in-app updater (and committee) can download
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: pvbennett01-png
          repo: fulford-competition-helper-releases
          updaterJsonPreferNsis: true
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: 'Fulford Competition Helper ${{ env.VER }}'
          # Release page shown to the committee - two clear download links (Windows job creates the release)
          releaseBody: |
            ## ⬇️ Download Fulford Competition Helper

            ### 🪟 Windows PC → **[Download for Windows](https://github.com/pvbennett01-png/fulford-competition-helper-releases/releases/download/${{ github.ref_name }}/Fulford.Competition.Helper_${{ env.VER }}_x64-setup.exe)**
            Then open the downloaded file. If Windows shows "Windows protected your PC", click **More info** → **Run anyway**.

            ### 🍎 Mac → **[Download for Mac](https://github.com/pvbennett01-png/fulford-competition-helper-releases/releases/download/${{ github.ref_name }}/Fulford.Competition.Helper_${{ env.VER }}_universal.dmg)**
            Open the downloaded file and drag the app into **Applications**.

            ---
            *Once installed, the app checks for new versions itself – just click **Install now** when asked. You can ignore the list of files below; they are used by the automatic updater.*
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
